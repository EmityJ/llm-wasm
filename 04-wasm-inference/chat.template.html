<!doctype html>
<!--__PROJECT_NOTICE__-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器里离线运行 Qwen3 的本地对话页。">
  <title>本地对话 · Qwen3</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      background: #0c1412;
      color: #f0f6f1;
      --panel: #151f1b;
      --border: #2b3c34;
      --soft-border: #24342c;
      --muted: #a2b4a9;
      --accent: #baf4d5;
      --on-accent: #142f24;
      --danger: #ffc0b5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      background: radial-gradient(ellipse at 17% 0%, #1c2e25 0, #0c1412 50rem);
    }

    button, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    [hidden] { display: none !important; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .topbar {
      border-bottom: 1px solid var(--soft-border);
      background: #0f1915bd;
    }

    .topbar-inner, .workspace {
      width: min(1200px, calc(100% - 56px));
      margin-inline: auto;
    }

    .topbar-inner {
      min-height: 82px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      position: relative;
      width: 42px;
      height: 42px;
      flex: none;
      border-radius: 12px;
      background: var(--accent);
    }
    .brand-mark::before, .brand-mark::after {
      position: absolute;
      content: "";
      border: 2px solid #254736;
      border-radius: 4px;
      width: 13px;
      height: 11px;
    }
    .brand-mark::before { top: 10px; left: 10px; }
    .brand-mark::after { top: 17px; left: 16px; background: var(--accent); }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1.2rem; letter-spacing: .02em; }
    .brand p { margin-top: 4px; color: var(--muted); font-size: .875rem; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #18241e;
      padding: 7px 12px;
      font-size: .875rem;
      color: var(--muted);
    }
    .status-pill::before {
      display: block;
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #89978e;
    }
    .status-pill[data-phase="ready"]::before { background: #9fe7bc; }
    .status-pill[data-phase="loading"]::before,
    .status-pill[data-phase="generating"]::before,
    .status-pill[data-phase="stopping"]::before { background: #e1cd8d; }

    .workspace {
      display: grid;
      grid-template-columns: 264px minmax(0, 1fr);
      gap: 20px;
      height: calc(100dvh - 130px);
      min-height: 535px;
      margin-block: 23px;
    }

    .sidebar { display: grid; align-content: start; gap: 13px; }
    .panel { border: 1px solid var(--border); border-radius: 17px; background: var(--panel); }
    .sidebar .panel { padding: 18px; }
    h2 { font-size: 1rem; font-weight: 650; }
    .model-type { margin-top: 13px; font-weight: 650; }
    .file-name {
      margin-top: 4px;
      min-height: 1.4em;
      overflow-wrap: anywhere;
      line-height: 1.45;
      color: var(--muted);
      font-size: .875rem;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 39px;
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #edf4ef;
      background: #223229;
      font-size: .875rem;
      font-weight: 650;
    }
    .button:hover:not(:disabled) { background: #2b4235; }
    .button:disabled { color: #879a8e; background: #1c2a23; }
    .button.primary {
      border-color: transparent;
      color: var(--on-accent);
      background: var(--accent);
    }
    .button.primary:hover:not(:disabled) { background: #d2fae5; }
    .button.primary:disabled { color: #a2b4a9; background: #263b30; }
    .choose { width: 100%; margin-top: 16px; }
    progress {
      display: block;
      appearance: none;
      width: 100%;
      height: 5px;
      border: 0;
      border-radius: 99px;
      color: #a9e8c6;
      background: #2b3c34;
    }
    progress::-webkit-progress-bar { border-radius: 99px; background: #2b3c34; }
    progress::-webkit-progress-value { border-radius: 99px; background: #a9e8c6; }
    progress::-moz-progress-bar { border-radius: 99px; background: #a9e8c6; }
    #load-progress { margin-top: 12px; }

    .field { margin-top: 14px; }
    .field label, .usage { font-size: .875rem; color: var(--muted); }
    .select-wrap { position: relative; display: block; margin-top: 6px; }
    .select-wrap::after {
      position: absolute;
      top: 14px;
      right: 13px;
      width: 6px;
      height: 6px;
      border-right: 1px solid var(--muted);
      border-bottom: 1px solid var(--muted);
      content: "";
      transform: rotate(45deg);
      pointer-events: none;
    }
    select {
      width: 100%;
      appearance: none;
      background: #101a15;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 30px 8px 10px;
      color: #edf4ef;
      font-size: .9rem;
    }
    .usage {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin: 17px 0 8px;
    }
    #usage-text { color: #d9e8dd; font-variant-numeric: tabular-nums; }
    .local-note { padding: 1px 3px; color: var(--muted); font-size: .875rem; line-height: 1.55; }

    .chat {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-height: 0;
      background: #111b16;
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 64px;
      padding: 12px 23px;
      border-bottom: 1px solid var(--soft-border);
    }
    .chat-scroll { min-width: 0; min-height: 0; overflow: auto; }
    .empty {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 36px 18px;
      text-align: center;
    }
    .empty-icon {
      display: block;
      position: relative;
      width: 76px;
      height: 76px;
      margin: 0 auto 17px;
      border: 1px solid #355346;
      border-radius: 22px;
      background: linear-gradient(145deg, #2a4437, #192c23);
    }
    .empty-icon::before, .empty-icon::after {
      position: absolute;
      content: "";
      width: 25px;
      height: 17px;
      border: 2px solid #779b83;
      border-radius: 6px;
    }
    .empty-icon::before { top: 19px; left: 17px; }
    .empty-icon::after { top: 30px; left: 29px; background: #233a2e; border-color: #b6efd1; }
    .empty h3 { font-size: clamp(1.15rem, 2vw, 1.55rem); letter-spacing: .015em; }
    .empty p { max-width: 39ch; margin: 8px auto 0; color: var(--muted); line-height: 1.55; }

    .messages {
      display: grid;
      gap: 22px;
      width: min(100%, 810px);
      margin-inline: auto;
      padding: 24px 22px 30px;
    }
    .message { width: fit-content; max-width: 92%; min-width: 0; }
    .message.user { justify-self: end; }
    .speaker { margin-bottom: 6px; color: var(--muted); font-size: .875rem; font-weight: 650; }
    .user .speaker { text-align: right; }
    .message-body {
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #1c2a22;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
    }
    .user .message-body { background: #254236; border-color: #39584a; }
    .message[aria-busy="true"] .message-body:empty::before { content: "···"; color: var(--muted); }
    .message-note { margin-top: 6px; color: var(--muted); font-size: .875rem; }

    .composer { border-top: 1px solid var(--soft-border); padding: 13px 22px 18px; }
    .entry {
      width: min(100%, 766px);
      margin-inline: auto;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #16231c;
    }
    .entry:focus-within { border-color: #84b397; }
    textarea {
      display: block;
      width: 100%;
      min-height: 58px;
      max-height: 180px;
      resize: vertical;
      background: transparent;
      border: 0;
      color: #f0f6f1;
      padding: 12px 13px 3px;
      line-height: 1.45;
    }
    textarea:focus-visible { outline-offset: -3px; border-radius: 12px; }
    textarea::placeholder { color: #9bab9e; }
    .compose-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-height: 52px;
      padding: 5px 8px 8px 13px;
    }
    #operation { margin-right: auto; color: var(--muted); font-size: .875rem; line-height: 1.35; }
    #send, #stop { min-width: 65px; }
    .problem { width: min(100%, 766px); margin: 0 auto 8px; color: var(--danger); line-height: 1.45; font-size: .875rem; }

    @media (max-width: 735px) {
      .topbar-inner, .workspace { width: calc(100% - 28px); }
      .topbar-inner { min-height: 70px; }
      .workspace { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 0; gap: 12px; margin-block: 14px; }
      .sidebar { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .sidebar .panel { padding: 13px; }
      .local-note { grid-column: 1 / -1; }
      .chat { min-height: 490px; height: 72dvh; }
      .chat-header { padding-inline: 14px; }
      .messages, .composer { padding-inline: 13px; }
    }

    @media (max-width: 385px) {
      .sidebar { grid-template-columns: minmax(0, 1fr); }
      .brand { gap: 8px; }
      .brand-mark { width: 39px; height: 39px; }
      .status-pill { padding-inline: 9px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>本地对话</h1>
          <p>Qwen3 · WebAssembly</p>
        </div>
      </div>
      <p class="status-pill" id="status" role="status" data-phase="empty">未加载模型</p>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar" aria-label="模型与推理设置">
      <section class="panel">
        <h2>本地模型</h2>
        <p class="model-type">Qwen3-0.6B · Q8_0</p>
        <p class="file-name" id="file-name">支持 .asmbin v1 和 v2</p>
        <input id="model-file" type="file" accept=".asmbin" aria-label="模型权重文件" hidden>
        <button class="button primary choose" id="choose" type="button">选择权重文件</button>
        <progress id="load-progress" max="100" value="0" aria-label="模型加载进度" hidden></progress>
      </section>

      <section class="panel">
        <h2>推理设置</h2>
        <div class="field">
          <label for="reply-limit">回复上限</label>
          <span class="select-wrap">
            <select id="reply-limit">
              <option value="32">32 词元</option>
              <option value="64">64 词元</option>
              <option value="128" selected>128 词元</option>
              <option value="256">256 词元</option>
            </select>
          </span>
        </div>
        <div class="usage">
          <span>上下文</span>
          <output id="usage-text" aria-live="off">—</output>
        </div>
        <progress id="usage-meter" max="1" value="0" aria-label="上下文用量"></progress>
      </section>
      <p class="local-note">权重和对话都在当前设备处理。</p>
    </aside>

    <section class="panel chat" aria-labelledby="chat-title">
      <div class="chat-header">
        <h2 id="chat-title">对话</h2>
        <button class="button" id="new-chat" type="button" disabled>新对话</button>
      </div>

      <div class="chat-scroll" id="chat-scroll" role="region" aria-label="对话记录" tabindex="0">
        <div class="empty" id="empty">
          <div>
            <span class="empty-icon" aria-hidden="true"></span>
            <h3 id="empty-title">选择模型后开始</h3>
            <p id="empty-detail">从本机选取已导出的 .asmbin 权重文件。</p>
          </div>
        </div>
        <div class="messages" id="messages" hidden></div>
      </div>

      <form class="composer" id="composer">
        <p class="problem" id="problem" role="alert" hidden></p>
        <div class="entry">
          <label class="sr-only" for="prompt">消息</label>
          <textarea id="prompt" rows="2" placeholder="加载模型后可输入消息" disabled></textarea>
          <div class="compose-actions">
            <p id="operation" role="status">Shift + Enter 换行</p>
            <button class="button" id="stop" type="button" hidden>停止</button>
            <button class="button primary" id="send" type="submit" disabled>发送</button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <script id="chat-runtime">/*__CHAT_RUNTIME__*/</script>
  <script>
    "use strict";

    const byId = (id) => document.getElementById(id);
    const ui = {
      status: byId("status"),
      choose: byId("choose"),
      file: byId("model-file"),
      name: byId("file-name"),
      progress: byId("load-progress"),
      limit: byId("reply-limit"),
      usage: byId("usage-text"),
      meter: byId("usage-meter"),
      reset: byId("new-chat"),
      scroll: byId("chat-scroll"),
      empty: byId("empty"),
      emptyTitle: byId("empty-title"),
      emptyDetail: byId("empty-detail"),
      messages: byId("messages"),
      composer: byId("composer"),
      problem: byId("problem"),
      prompt: byId("prompt"),
      operation: byId("operation"),
      stop: byId("stop"),
      send: byId("send"),
    };

    const statuses = {
      empty: "未加载模型",
      loading: "正在加载模型",
      ready: "模型已就绪",
      generating: "正在推理",
      stopping: "正在停止",
    };
    let phase = "empty";
    let inference;
    let workerUrl;
    let useWorker = location.protocol !== "file:";
    let pending;
    let capacity = 0;
    let used = 0;

    function setProblem(text = "") {
      ui.problem.textContent = text;
      ui.problem.hidden = !text;
    }

    function updateUsage() {
      ui.usage.textContent = capacity ? used + " / " + capacity : "—";
      ui.meter.max = capacity || 1;
      ui.meter.value = used;
    }

    function updateSend() {
      ui.send.disabled = phase !== "ready" || used === capacity || !ui.prompt.value.trim();
    }

    function render() {
      const loading = phase === "loading";
      const busy = phase === "generating" || phase === "stopping";
      const loaded = phase === "ready" || busy;
      const hasMessages = ui.messages.childElementCount > 0;
      ui.status.textContent = statuses[phase];
      ui.status.dataset.phase = phase;
      ui.choose.disabled = loading || busy;
      ui.choose.textContent = loaded ? "更换权重文件" : "选择权重文件";
      ui.progress.hidden = !loading;
      ui.limit.disabled = busy;
      ui.reset.disabled = phase !== "ready" || !hasMessages;
      ui.prompt.disabled = !loaded;
      ui.prompt.placeholder = loaded ? "输入消息，Enter 发送" : "加载模型后可输入消息";
      ui.stop.hidden = !busy;
      ui.stop.disabled = phase === "stopping";
      ui.send.hidden = busy;
      ui.messages.hidden = !hasMessages;
      ui.empty.hidden = hasMessages;
      ui.emptyTitle.textContent = loaded ? "发一条消息" : loading ? "正在加载权重" : "选择模型后开始";
      ui.emptyDetail.textContent = loaded
        ? "本轮的消息和回复会保留到下一轮。"
        : loading ? "加载完成后即可发送消息。" : "从本机选取已导出的 .asmbin 权重文件。";
      updateSend();
      updateUsage();
    }

    function scrollToLatest() {
      ui.scroll.scrollTop = ui.scroll.scrollHeight;
    }

    function makeMessage(role, value) {
      const article = document.createElement("article");
      article.className = "message " + role;
      const speaker = document.createElement("p");
      speaker.className = "speaker";
      speaker.textContent = role === "user" ? "你" : "Qwen3";
      const body = document.createElement("div");
      body.className = "message-body";
      const text = document.createTextNode(value);
      const note = document.createElement("p");
      note.className = "message-note";
      note.hidden = true;
      body.append(text);
      article.append(speaker, body, note);
      ui.messages.append(article);
      return { article, text, note };
    }

    function rollbackReply() {
      if (!pending) return;
      pending.user.article.remove();
      pending.answer.article.remove();
      if (!ui.prompt.value) ui.prompt.value = pending.prompt;
      pending = undefined;
    }

    function finishReply(data) {
      if (!data.accepted) {
        rollbackReply();
      } else {
        const answer = pending.answer;
        answer.article.removeAttribute("aria-busy");
        if (!answer.text.data) answer.text.data = "本次回复没有生成文本。";
        const notes = {
          stopped: "已停止",
          limit: "达到单次回复上限",
          context: "上下文已满",
        };
        answer.note.textContent = notes[data.reason] || "";
        answer.note.hidden = !answer.note.textContent;
        pending = undefined;
      }
      used = data.used;
      phase = "ready";
      if (used === capacity) ui.operation.textContent = "请新建对话以继续";
      else if (data.reason === "stopped" && !data.accepted) ui.operation.textContent = "已停止，可以重新发送";
      else ui.operation.textContent = "Shift + Enter 换行";
      render();
      if (data.reason === "stopped") ui.prompt.focus({ preventScroll: true });
    }

    function stopInference() {
      const previous = inference;
      inference = undefined;
      previous?.terminate();
    }

    function loadFailed(message) {
      rollbackReply();
      stopInference();
      phase = "empty";
      capacity = 0;
      used = 0;
      ui.operation.textContent = "Shift + Enter 换行";
      setProblem(message);
      render();
    }

    function onInferenceMessage(data) {
      switch (data.type) {
        case "progress":
          ui.progress.value = data.percent;
          ui.status.textContent = "加载模型 " + data.percent + "%";
          break;
        case "ready":
          capacity = data.capacity;
          phase = "ready";
          render();
          ui.prompt.focus({ preventScroll: true });
          break;
        case "load-error":
          loadFailed(data.message);
          break;
        case "prefill":
          if (phase === "generating") ui.operation.textContent = "处理上下文 " + data.position + " / " + data.total;
          break;
        case "token": {
          const follow = ui.scroll.scrollHeight - ui.scroll.scrollTop - ui.scroll.clientHeight < 60;
          pending.answer.text.appendData(data.text);
          used = data.used;
          updateUsage();
          if (phase === "generating" && ui.operation.textContent !== "正在生成回复") {
            ui.operation.textContent = "正在生成回复";
          }
          if (follow) scrollToLatest();
          break;
        }
        case "done":
          finishReply(data);
          break;
        case "reply-error":
          finishReply({ accepted: false, used: data.used });
          setProblem(data.message);
          break;
      }
    }

    function startPageInference(file) {
      stopInference();
      useWorker = false;
      ui.progress.value = 0;
      ui.status.textContent = statuses.loading;
      try {
        const port = {
          postMessage(data) {
            setTimeout(() => {
              if (inference === port) receive(data);
            }, 0);
          },
          terminate() {
            receive({ type: "stop" });
          },
        };
        const receive = connectChatRuntime((data) => {
          if (inference === port) onInferenceMessage(data);
        });
        inference = port;
        port.postMessage({ type: "load", file });
      } catch (error) {
        loadFailed("无法启动页内推理（" + error.message + "）");
      }
    }

    function startWorkerInference(file) {
      if (!workerUrl) {
        const source = byId("chat-runtime").textContent;
        workerUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
      }
      const thread = new Worker(workerUrl);
      inference = thread;
      thread.addEventListener("message", ({ data }) => {
        if (inference === thread) onInferenceMessage(data);
      });
      thread.addEventListener("error", (event) => {
        if (inference !== thread) return;
        event.preventDefault();
        if (phase === "loading") startPageInference(file);
        else loadFailed(event.message || "推理在运行中中断，请重新载入模型。");
      });
      thread.postMessage({ type: "load", file });
    }

    function loadFile(file) {
      stopInference();
      pending = undefined;
      phase = "loading";
      used = 0;
      capacity = 0;
      ui.messages.replaceChildren();
      ui.progress.value = 0;
      ui.name.textContent = file.name;
      ui.operation.textContent = "Shift + Enter 换行";
      setProblem();
      render();
      if (useWorker) {
        try {
          startWorkerInference(file);
          return;
        } catch {
          // 浏览器同步拒绝 Worker 时，也用同一个文件启动页内推理。
        }
      }
      startPageInference(file);
    }

    ui.choose.addEventListener("click", () => ui.file.click());
    ui.file.addEventListener("change", () => {
      const file = ui.file.files[0];
      ui.file.value = "";
      if (file) loadFile(file);
    });

    ui.prompt.addEventListener("input", updateSend);
    ui.prompt.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
        event.preventDefault();
        if (!ui.send.disabled) ui.composer.requestSubmit();
      }
    });
    ui.composer.addEventListener("submit", (event) => {
      event.preventDefault();
      const prompt = ui.prompt.value.trim();
      if (phase !== "ready" || !prompt || used === capacity) return;
      setProblem();
      const user = makeMessage("user", prompt);
      const answer = makeMessage("assistant", "");
      answer.article.setAttribute("aria-busy", "true");
      pending = { prompt, user, answer };
      ui.prompt.value = "";
      phase = "generating";
      ui.operation.textContent = "正在处理上下文";
      render();
      scrollToLatest();
      ui.prompt.focus({ preventScroll: true });
      inference.postMessage({ type: "reply", prompt, maxTokens: Number(ui.limit.value) });
    });

    ui.stop.addEventListener("click", () => {
      if (phase !== "generating") return;
      phase = "stopping";
      ui.operation.textContent = "正在停止";
      render();
      inference.postMessage({ type: "stop" });
    });
    ui.reset.addEventListener("click", () => {
      if (phase !== "ready") return;
      inference.postMessage({ type: "reset" });
      ui.messages.replaceChildren();
      used = 0;
      ui.operation.textContent = "Shift + Enter 换行";
      setProblem();
      render();
      ui.prompt.focus({ preventScroll: true });
    });
    render();
  </script>
</body>
</html>
